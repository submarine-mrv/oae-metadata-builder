[build]
  command = "npm run build"
  publish = "dist"

# Newest Node that Netlify offers is 24; .mise.toml and CI run 26.
[build.environment]
  NODE_VERSION = "26"

# SPA fallback: client-side routes (e.g. /project) must serve index.html on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
